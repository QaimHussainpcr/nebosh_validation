<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        /* =========================
           RESULT
        ========================= */

        #result {
            display: none;
        }

        .verified {
            background: #198754;
            color: white;
            padding: 16px;
            text-align: center;
            border-radius: 10px 10px 0 0;
            font-size: 20px;
            font-weight: bold;
        }

        .details {
            border: 1px solid #ddd;
            border-top: none;
            padding: 20px;
            border-radius: 0 0 10px 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
            text-align: right;
        }

        .status-valid {
            color: #198754;
            font-weight: bold;
        }

        /* =========================
           INVALID
        ========================= */

        .invalid {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .invalid h2 {
            color: #dc3545;
            margin-bottom: 10px;
        }

        .invalid p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================
           MODAL
        ========================= */

        .captcha-modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.65);

            display: none;

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 9999;
        }

        /* =========================
           CAPTCHA BOX
        ========================= */

        .captcha-box {
            width: 100%;
            max-width: 560px;

            background: #ffffff;

            border-radius: 10px;

            padding: 36px 30px;

            text-align: center;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.30);

            animation: popup 0.25s ease;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .captcha-box h2 {
            font-size: 28px;
            color: #222;
            margin-bottom: 10px;
        }

        .captcha-box>p {
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* =========================
           CAPTCHA WIDGET
        ========================= */

        .captcha-widget {
            width: 100%;
            max-width: 378px;
            height: 95px;

            margin: 0 auto;

            background: #fafafa;

            border: 1px solid #d5d5d5;

            border-radius: 2px;

            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.12);

            display: flex;

            align-items: center;

            position: relative;

            padding: 0 15px;
        }

        /* =========================
           CHECKBOX
        ========================= */

        .captcha-checkbox {
            width: 34px;
            height: 34px;

            border: 2px solid #555;

            background: #ffffff;

            flex-shrink: 0;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: 0.15s;
        }

        .captcha-checkbox:hover {
            border-color: #222;
        }

        .captcha-checkbox.checked {
            background: #198754;
            border-color: #198754;
        }

        .captcha-check {
            display: none;

            color: #ffffff;

            font-size: 23px;

            font-weight: bold;
        }

        .captcha-checkbox.checked .captcha-check {
            display: block;
        }

        /* =========================
           CAPTCHA TEXT
        ========================= */

        .captcha-text {
            margin-left: 17px;

            font-size: 18px;

            color: #222;

            white-space: nowrap;

            user-select: none;
        }

        /* =========================
           DEMO SECURITY LOGO
        ========================= */

        .captcha-brand {
            margin-left: auto;

            width: 70px;

            height: 75px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }

        .security-logo {
            width: 42px;
            height: 42px;

            position: relative;
        }

        .captcha-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        /* Blue circular logo */

        .logo-circle {
            position: absolute;

            width: 34px;
            height: 34px;

            border: 7px solid #4285f4;

            border-right-color: transparent;

            border-radius: 50%;

            top: 4px;
            left: 4px;

            transform: rotate(-35deg);
        }

        /* Arrow */

        .logo-arrow {
            position: absolute;

            width: 0;
            height: 0;

            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #4285f4;

            right: 0;
            top: 4px;

            transform: rotate(15deg);
        }

        .brand-text {
            font-size: 10px;

            color: #666;

            margin-top: 2px;
        }

        /* =========================
           VERIFYING
        ========================= */

        .verifying {
            display: none;

            margin-top: 18px;

            color: #555;

            font-size: 14px;
        }

        .spinner {
            width: 18px;
            height: 18px;

            border: 3px solid #ddd;

            border-top-color: #198754;

            border-radius: 50%;

            display: inline-block;

            vertical-align: middle;

            margin-right: 7px;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           DEMO LABEL
        ========================= */

        .demo-label {
            margin-top: 20px;

            font-size: 11px;

            color: #999;

            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 23px;
            }

            .row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .value {
                text-align: left;
            }

            .captcha-box {
                padding: 30px 18px;
            }

            .captcha-box h2 {
                font-size: 24px;
            }

            .captcha-widget {
                height: 90px;
                padding: 0 12px;
            }

            .captcha-text {
                font-size: 16px;
                margin-left: 13px;
            }

            .captcha-brand {
                width: 60px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">

       


        <!-- =========================
             VALID CERTIFICATE
        ========================= -->

        <div id="result">

            <div class="verified">
                ✓ Certificate Verified
            </div>

            <div class="details">

                <div class="row">

                    <span class="label">
                        Certificate No.
                    </span>

                    <span class="value" id="certificateNo">
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Name
                    </span>

                    <span class="value" id="name">
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Course
                    </span>

                    <span class="value" id="course">
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Issue Date
                    </span>

                    <span class="value" id="issueDate">
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Expiry Date
                    </span>

                    <span class="value" id="expiryDate">
                    </span>

                </div>


                <div class="row">

                    <span class="label">
                        Status
                    </span>

                    <span class="value status-valid" id="status">
                    </span>

                </div>

            </div>

        </div>


        <!-- =========================
             INVALID CERTIFICATE
        ========================= -->

        <div class="invalid" id="invalid">

            <h2>
                Certificate Not Found
            </h2>

            <p>
                The certificate number is invalid
                or does not exist.
            </p>

        </div>

    </div>


    <!-- =========================
         SECURITY MODAL
    ========================= -->

    <div class="captcha-modal" id="captchaModal">

        <div class="captcha-box">

           


            <!-- =========================
                 CAPTCHA STYLE BOX
            ========================= -->

            <div class="captcha-widget">


                <!-- CHECKBOX -->

                <div class="captcha-checkbox" id="captchaCheckbox" onclick="verifyCaptcha()">

                    <span class="captcha-check">
                        ✓
                    </span>

                </div>


                <!-- TEXT -->

                <div class="captcha-text">
                    I'm not a robot
                </div>


                <!-- LOGO -->

                <div class="captcha-brand">
                    <img src="./img/12.png" alt="Security" class="captcha-logo">

                    <div class="brand-text">
                        Security
                    </div>
                </div>

            </div>


            <!-- VERIFYING -->

            <div class="verifying" id="verifying">

                <span class="spinner"></span>

                Verifying...

            </div>


            <div class="demo-label">
                Demo Security Verification
            </div>

        </div>

    </div>


    <script>

        /* ==========================================
           CERTIFICATE DATA
        ========================================== */

        const certificates = {

            "CERT001": {

                certificateNo: "CERT001",

                name: "Muhammad Aslam",

                course: "Safety Officer",

                issueDate: "15 September 2026",

                expiryDate: "15 September 2028",

                status: "Valid"

            },


            "CERT002": {

                certificateNo: "CERT002",

                name: "Ali Khan",

                course: "HSE Officer",

                issueDate: "10 August 2026",

                expiryDate: "10 August 2028",

                status: "Valid"

            },


            "CERT003": {

                certificateNo: "CERT003",

                name: "Ahmed Hussain",

                course: "Permit Receiver",

                issueDate: "20 July 2026",

                expiryDate: "20 July 2028",

                status: "Valid"

            }

        };


        /* ==========================================
           GET ID FROM URL
        ========================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const certificateID =
            urlParams.get("id");


        /* ==========================================
           PAGE LOAD
        ========================================== */

        window.addEventListener(
            "load",
            function () {

                /*
                    No certificate ID
                */

                if (!certificateID) {

                    document.getElementById(
                        "invalid"
                    ).style.display = "block";

                    return;
                }


                /*
                    Show security verification
                */

                document.getElementById(
                    "captchaModal"
                ).style.display = "flex";

            }
        );


        /* ==========================================
           DEMO CAPTCHA VERIFICATION
        ========================================== */

        function verifyCaptcha() {

            const checkbox =
                document.getElementById(
                    "captchaCheckbox"
                );


            const verifying =
                document.getElementById(
                    "verifying"
                );


            /*
                Prevent double click
            */

            checkbox.onclick = null;


            /*
                Tick checkbox
            */

            checkbox.classList.add(
                "checked"
            );


            /*
                Show loading
            */

            verifying.style.display =
                "block";


            /*
                Verification delay
            */

            setTimeout(
                function () {

                    document.getElementById(
                        "captchaModal"
                    ).style.display =
                        "none";


                    showCertificate();

                },
                900
            );

        }


        /* ==========================================
           SHOW CERTIFICATE
        ========================================== */

        function showCertificate() {

            const certificate =
                certificates[certificateID];


            /*
                Certificate doesn't exist
            */

            if (!certificate) {

                document.getElementById(
                    "invalid"
                ).style.display =
                    "block";

                return;
            }


            /*
                Certificate Number
            */

            document.getElementById(
                "certificateNo"
            ).textContent =
                certificate.certificateNo;


            /*
                Name
            */

            document.getElementById(
                "name"
            ).textContent =
                certificate.name;


            /*
                Course
            */

            document.getElementById(
                "course"
            ).textContent =
                certificate.course;


            /*
                Issue Date
            */

            document.getElementById(
                "issueDate"
            ).textContent =
                certificate.issueDate;


            /*
                Expiry Date
            */

            document.getElementById(
                "expiryDate"
            ).textContent =
                certificate.expiryDate;


            /*
                Status
            */

            document.getElementById(
                "status"
            ).textContent =
                certificate.status;


            /*
                Show result
            */

            document.getElementById(
                "result"
            ).style.display =
                "block";

        }

    </script>

</body>

</html>
